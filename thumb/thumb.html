<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {

        .image-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .image-container img.visible {

    <!-- Lazy Load & Fade Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const images = document.querySelectorAll("img[data-src]");
            // LazyLoad Observer (先読み用、早めに画像読み込み開始)
            const lazyLoadOptions = {
                root: null,
                rootMargin: '100px',
                threshold: 0.1
            };

            const lazyLoadObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const img = entry.target;
                    if (entry.isIntersecting && !img.src) {
                        img.src = img.dataset.src;
                    }
                });
            }, lazyLoadOptions);

            // Fade Observer (フェードイン/フェードアウト用)
            const fadeThreshold = 0.25;
            const fadeOptions = {
                root: null,
                rootMargin: '0px',
                threshold: fadeThreshold
            };

            const fadeObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const img = entry.target;
                    const ratio = entry.intersectionRatio;
                    if (ratio >= fadeThreshold) {
                        // フェードイン: threshold 以上で visible を追加
                        img.classList.add('visible');
                    } else {
                        // フェードアウト: threshold 未満で visible を削除
                        img.classList.remove('visible');
                    }
                });
            }, fadeOptions);

            images.forEach(img => {
                lazyLoadObserver.observe(img);
                fadeObserver.observe(img);
            });
        });
    </script>
